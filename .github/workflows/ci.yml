name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rent-ledger-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rent-ledger-source/package-lock.json
      - run: npm ci --omit=dev
      - run: node --check server.js && node --check public/app.js && node --check public/modules.js && node --check public/i18n.js
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
